services:
  stage_postgres:
    image: postgres:16
    container_name: sma_stage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma_user
      POSTGRES_PASSWORD: sma_password
      POSTGRES_DB: sma_stage_db
    ports:
      - "55433:5432"
    volumes:
      - postgres_stage_data:/var/lib/postgresql/data

  stage_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SMA_RELEASE_ENFORCE: ${SMA_RELEASE_ENFORCE:-false}
        SMA_RELEASE_COMMIT_SHA: ${SMA_RELEASE_COMMIT_SHA:-local}
        SMA_RELEASE_ENVIRONMENT: ${SMA_RELEASE_ENVIRONMENT:-local}
    container_name: sma_stage_backend
    restart: unless-stopped
    depends_on:
      - stage_postgres
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://sma_user:sma_password@stage_postgres:5432/sma_stage_db?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-stage-local-secret-change-me}
      PORT: 3000
      PLATFORM_ADMIN_EMAIL: admin@stage.local
      PLATFORM_ADMIN_PASSWORD: StageAdmin_2026!
      PLATFORM_COMPANY_NAME: ServiceManager Stage Platform
      CORS_ALLOWED_ORIGINS: http://194.67.101.37:4174,http://127.0.0.1:4174,http://localhost:4174
      MAX_BOT_API_TOKEN: ${MAX_BOT_API_TOKEN}
      MAX_BOT_API_BASE_URL: ${MAX_BOT_API_BASE_URL}
      MAX_GROUP_CHAT_ID: ${MAX_GROUP_CHAT_ID}
      MAX_BOT_COMMANDS_ENABLED: ${MAX_BOT_COMMANDS_ENABLED:-true}
      MAX_BOT_POLL_INTERVAL_MS: ${MAX_BOT_POLL_INTERVAL_MS:-5000}
    ports:
      - "3001:3000"

  stage_web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://194.67.101.37:3001
    container_name: sma_stage_web
    restart: unless-stopped
    depends_on:
      - stage_backend
    ports:
      - "4174:4173"

volumes:
  postgres_stage_data:
