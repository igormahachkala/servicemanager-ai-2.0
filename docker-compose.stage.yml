services:
  stage_postgres:
    image: postgres:16
    container_name: sma_stage_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "55433:5432"
    volumes:
      - postgres_stage_data:/var/lib/postgresql/data

  stage_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SMA_RELEASE_ENFORCE: ${SMA_RELEASE_ENFORCE:-false}
        SMA_RELEASE_COMMIT_SHA: ${SMA_RELEASE_COMMIT_SHA:-local}
        SMA_RELEASE_ENVIRONMENT: ${SMA_RELEASE_ENVIRONMENT:-local}
    container_name: sma_stage_backend
    restart: unless-stopped
    depends_on:
      - stage_postgres
    env_file:
      - .env
    ports:
      - "3001:3000"

  stage_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sma_stage_web
    restart: unless-stopped
    depends_on:
      - stage_backend
    ports:
      - "4174:4173"

volumes:
  postgres_stage_data:
