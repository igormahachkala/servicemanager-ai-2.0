name: app

on:
  pull_request:
    branches:
      - beta
      - prod

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sma
          POSTGRES_PASSWORD: sma
          POSTGRES_DB: sma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sma -d sma"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://sma:sma@localhost:5432/sma?schema=public
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx jest --watchman=false
      - run: npx prisma migrate deploy

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: npm run test:offline
