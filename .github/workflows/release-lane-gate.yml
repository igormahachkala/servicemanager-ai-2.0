name: Trusted Release Lane Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [beta, prod]

permissions:
  contents: read

concurrency:
  group: release-pr-verification-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-lane-gate:
    name: Release gate runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-governance
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mint source-bound Release Gate App token
        id: gate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.RELEASE_GATE_APP_ID }}
          private-key: ${{ secrets.RELEASE_GATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Verify immutable PR evidence without acquiring a release lock
        env:
          GH_TOKEN: ${{ steps.gate-token.outputs.token }}
          MODE: verify
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_APP_ID: ${{ vars.INDEPENDENT_REVIEW_APP_ID }}
          ADMISSION_CHECK_NAME: Release lane gate
        run: skills/_shared/scripts/release-gate-v2-github.sh
