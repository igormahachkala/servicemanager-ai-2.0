services:
  postgres:
    image: postgres:16
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma_user
      POSTGRES_PASSWORD: sma_password
      POSTGRES_DB: sma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sma_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://sma_user:sma_password@postgres:5432/sma_db
      JWT_SECRET: supersecret_change_me
    depends_on:
      - postgres
    command: npm run start

volumes:
  postgres_data:
