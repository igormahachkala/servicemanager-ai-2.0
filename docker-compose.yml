version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma_user
      POSTGRES_PASSWORD: sma_password
      POSTGRES_DB: sma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sma_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads
    command: sh -lc "npx prisma migrate deploy && npm run start:prod"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://194.67.101.37:3000
    container_name: sma_web
    restart: unless-stopped
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
