services:
  postgres:
    image: postgres:16
    container_name: sma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sma_user
      POSTGRES_PASSWORD: sma_password
      POSTGRES_DB: sma_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: sma_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
    command: npm run start:docker

volumes:
  postgres_data:
