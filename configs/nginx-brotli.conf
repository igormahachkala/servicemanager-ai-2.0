# B-3. Вставить в блок http /etc/nginx/nginx.conf после секции Gzip Settings.
# Модули уже загружены: /etc/nginx/modules-enabled/50-mod-http-brotli-*.conf
# Не копировать этот файл поверх nginx.conf.

brotli on;
brotli_comp_level 6;
brotli_min_length 1024;
brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;
