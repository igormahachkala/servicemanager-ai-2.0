# B-7. Вставить в блок http /etc/nginx/nginx.conf ТОЛЬКО после смены DNS на Curator.
# Сначала сверить источники: sudo awk '{print $2}' /var/log/nginx/hosted.log | sort | uniq -c | sort -rn | head -20
# Все адреса должны быть из 185.94.108.0/24; иначе дописать set_real_ip_from.
# До переключения DNS не применять: любой клиент станет доверенным прокси.
# Не копировать этот файл поверх nginx.conf.

set_real_ip_from 185.94.108.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
