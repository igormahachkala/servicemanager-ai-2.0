# B-2. Заменить блок log_format hosted в /etc/nginx/nginx.conf (сейчас строки 40–42).
# Не копировать этот файл поверх nginx.conf.
# После reload до Curator в строке журнала: xff="-" qsrc="-"

log_format hosted '$host $remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                  'xff="$http_x_forwarded_for" qsrc="$http_x_qrator_ip_source"';
