# Static SPA for the web container. Replaces `vite preview`.
# Host nginx still terminates TLS and proxies to 127.0.0.1:4173 (prod) / :4174 (stage).
# Listen on 4173 so compose maps stay 4173:4173 and 4174:4173.

server {
    listen 4173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip off;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
