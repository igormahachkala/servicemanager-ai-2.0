# MAX Mini App subdomain — max.servicemanagerai.ru
# Proxies to the same frontend container as the main domain (127.0.0.1:4173).
#
# Deploy:
#   1. Copy this file to /etc/nginx/sites-available/max.servicemanagerai.ru
#   2. ln -s /etc/nginx/sites-available/max.servicemanagerai.ru /etc/nginx/sites-enabled/
#   3. certbot --nginx -d max.servicemanagerai.ru
#   4. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name max.servicemanagerai.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name max.servicemanagerai.ru;

    client_max_body_size 25M;

    # Certificates — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/max.servicemanagerai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max.servicemanagerai.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # MAX requires HTTPS; allow embedding in MAX WebView
    add_header X-Frame-Options "ALLOWALL";
    add_header Content-Security-Policy "frame-ancestors *";

    location / {
        proxy_pass         http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA fallback — let React Router handle all paths
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
