# Live path: /etc/nginx/sites-available/stage.sma-assistants.ru
# Enabled:   /etc/nginx/sites-enabled/stage.sma-assistants.ru
#
# Staging FRONTEND vhost — stage.sma-assistants.ru → stage_web (127.0.0.1:4174)
#
# ВАЖНО (реальность VPS на 2026-07): stage-api.sma-assistants.ru УЖЕ настроен
# отдельным vhost'ом и УЖЕ имеет валидный Let's Encrypt сертификат (https .../health = 200).
# Поэтому здесь ТОЛЬКО фронтовый блок. НЕ добавлять сюда server-блок для stage-api —
# это дубль server_name и конфликт с существующим рабочим vhost'ом.
#
# Before applying:
#   sudo apt-get install -y libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
# nginx 1.24.0: HTTP/2 via `listen 443 ssl http2;` (not `http2 on;`).

server {
    server_name stage.sma-assistants.ru;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ^~ /assets/ {
        proxy_pass         http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:4174;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stage.sma-assistants.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stage.sma-assistants.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = stage.sma-assistants.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name stage.sma-assistants.ru;
    return 404; # managed by Certbot


}
