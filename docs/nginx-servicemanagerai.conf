# Live path: /etc/nginx/sites-available/servicemanagerai
# Enabled:   /etc/nginx/sites-enabled/servicemanagerai
#
# Combined Production vhost (web + api + max). This is the file nginx actually
# loads. docs/nginx-api.servicemanagerai.ru.conf and
# docs/nginx-max.servicemanagerai.ru.conf are not enabled on the server.
#
# Before applying:
#   sudo apt-get install -y libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
# nginx 1.24.0: HTTP/2 via `listen 443 ssl http2;` (not `http2 on;`).
# Brotli only on static hosts. API JSON compression is a later wave.

server {
    server_name servicemanagerai.ru www.servicemanagerai.ru;
    if ($host = www.servicemanagerai.ru) {
        return 301 https://servicemanagerai.ru$request_uri;
    }


    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/servicemanagerai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servicemanagerai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name api.servicemanagerai.ru;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/servicemanagerai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servicemanagerai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name max.servicemanagerai.ru;

    client_max_body_size 25M;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/max.servicemanagerai.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/max.servicemanagerai.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = servicemanagerai.ru) {
        return 301 https://$host$request_uri;
    }

    if ($host = www.servicemanagerai.ru) {
        return 301 https://servicemanagerai.ru$request_uri;
    }

    server_name servicemanagerai.ru www.servicemanagerai.ru;
    listen 80;
    return 404;
}

server {
    if ($host = api.servicemanagerai.ru) {
        return 301 https://$host$request_uri;
    }

    server_name api.servicemanagerai.ru;
    listen 80;
    return 404;
}


server {
    if ($host = max.servicemanagerai.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name max.servicemanagerai.ru;

    listen 80;
    return 404; # managed by Certbot


}
