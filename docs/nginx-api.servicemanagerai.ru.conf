# API subdomain — api.servicemanagerai.ru
# Proxies to the NestJS backend container (127.0.0.1:3000).
#
# Deploy:
#   1. Copy this file to /etc/nginx/sites-available/api.servicemanagerai.ru
#   2. ln -s /etc/nginx/sites-available/api.servicemanagerai.ru /etc/nginx/sites-enabled/
#   3. certbot --nginx -d api.servicemanagerai.ru
#   4. nginx -t && systemctl reload nginx
#
# IMPORTANT: client_max_body_size must be at least 25M here.
# iPhone camera photos are typically 3–10 MB. Nginx's default 1 MB limit
# causes the upload to be aborted, which iOS WebView reports as "Load failed"
# (not a proper 413), masking the real error as a network failure.

server {
    listen 80;
    server_name api.servicemanagerai.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.servicemanagerai.ru;

    client_max_body_size 25M;

    # Certificates — filled in by certbot
    ssl_certificate     /etc/letsencrypt/live/api.servicemanagerai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.servicemanagerai.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket endpoint — must appear before location / so nginx uses the
    # longer prefix match and forwards the Upgrade handshake correctly.
    location /ws {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
